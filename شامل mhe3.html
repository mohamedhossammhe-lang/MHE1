<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنتر التوفير - نظام الأرفف الذكي</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Tahoma,sans-serif; }
body{ background:#f4f6f8; padding:10px; }
.card{ max-width:650px; margin:auto; background:#fff; border-radius:15px; padding:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
.title{ text-align:center; font-size:26px; color:#ff9800; font-weight:bold; margin-bottom:10px; }
.toolbar{ display:flex; flex-direction:column; gap:8px; margin-bottom:15px; }
input, button{ width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc; font-weight:bold; cursor:pointer; }
button{ color:white; border:none; }
.btn-file{ background:#ff9800; }
.btn-export{ background:#2e7d32; }
.btn-search{ background:#009688; }
.btn-clear{ background:#d32f2f; }

#reader { width:100%; max-width:350px; margin:10px auto; display:none; border-radius:8px; overflow:hidden; }

.shelves-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
@media(min-width: 500px){ .shelves-grid{ grid-template-columns:repeat(2, 1fr); } }

.shelf-card{ background:#fafafa; border-radius:8px; padding:10px; border:1px solid #ddd; border-right:5px solid #1565c0; }
.shelf-title{ font-size:14px; font-weight:bold; color:#333; margin-bottom:6px; display:flex; justify-content:space-between; }
.item-row{ background:#fff; padding:6px; margin-bottom:4px; border-radius:6px; border:1px solid #eee; font-size:12px; display:flex; justify-content:space-between; align-items:center; }
.search-box-res{ background:#e3f2fd; padding:10px; border-radius:8px; margin-bottom:10px; display:none; font-size:14px; border:1px solid #90caf9; }
</style>
</head>
<body>

<div class="card">
<div class="title">🏪 سنتر التوفير</div>

<div class="toolbar">
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv" style="display:none">
<button class="btn-file" onclick="document.getElementById('excelFile').click()">📂 اختيار ملف أصناف المحل (Excel)</button>
<button class="btn-export" onclick="exportShelvesExcel()">📥 تحميل شيت الأرفف (Excel)</button>
<button class="btn-search" onclick="startGlobalSearch()">📷 بحث بالكاميرا عن منتج أو رف</button>
<input type="text" id="textSearch" placeholder="🔍 اكتب اسم المنتج أو الباركود للبحث...">
<button class="btn-clear" onclick="clearAllShelves()">🗑️ حذف بيانات كل الأرفف</button>
</div>

<div class="search-box-res" id="searchResBox"></div>

<div id="reader"></div>
<button id="closeCam" style="background:#c62828; display:none; margin-bottom:10px;" onclick="stopCamera()">إغلاق الكاميرا</button>

<div class="shelves-grid" id="shelvesContainer"></div>

<div id="statusNote" style="text-align:center; font-size:12px; color:#666; margin-top:15px;"></div>
</div>

<script>
let products = [];
let shelves = [];
let html5QrCode = null;
let activeShelfId = null;
let mode = 'shelf'; // 'shelf' or 'global'

// استرجاع ملف الأصناف المخزن مسبقاً لضمان عدم ضياعه
let savedProds = localStorage.getItem("store_products_v2");
if(savedProds) {
    try { products = JSON.parse(savedProds); } catch(e){}
}

// تهيئة 150 رف
for(let i = 1; i <= 150; i++){
    let saved = localStorage.getItem("shelf_data_" + i);
    shelves.push({
        id: i,
        items: saved ? JSON.parse(saved) : []
    });
}

function saveShelf(id){
    let shelf = shelves.find(s => s.id === id);
    localStorage.setItem("shelf_data_" + id, JSON.stringify(shelf.items));
    updateStatus();
}

function updateStatus(){
    let total = 0;
    shelves.forEach(s => total += s.items.length);
    document.getElementById("statusNote").innerText = `الأصناف بملف المحل: ${products.length} | إجمالي المنتجات الموزعة بالرفوف: ${total}`;
}

// تحميل ملف إكسل المحل
document.getElementById("excelFile").onchange = function(e){
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = function(evt){
        try {
            let data = evt.target.result;
            let workbook = XLSX.read(data, {type: 'binary'});
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            products = XLSX.utils.sheet_to_json(sheet);
            localStorage.setItem("store_products_v2", JSON.stringify(products));
            updateStatus();
            alert("✅ تم حفظ ملف أصناف المحل بنجاح ولن يضيع أبداً!");
        } catch(err) {
            alert("خطأ في قراءة ملف الإكسل، تأكد من أن الملف صحيح.");
        }
    };
    reader.readAsBinaryString(file);
};

// البحث عن تفاصيل المنتج
function getProductDetails(code){
    code = String(code).trim();
    for(let i = 0; i < products.length; i++){
        let row = products[i];
        let bar = String(row["رقم الباركود"] || row["كود الصنف"] || row["الباركود"] || row["Barcode"] || "").trim();
        if(bar === code || bar.includes(code)){
            return {
                name: row["اسم المنتج"] || row["اسم الصنف"] || row["الصنف"] || "بدون اسم",
                price: row["سعر البيع"] || row["السعر"] || row["بيع"] || "0"
            };
        }
    }
    return null;
}

// عرض الأرفف
function renderShelves(){
    let container = document.getElementById("shelvesContainer");
    container.innerHTML = "";

    shelves.forEach(shelf => {
        let itemsHtml = "";
        if(shelf.items.length === 0){
            itemsHtml = '<div style="color:#888; font-size:11px; text-align:center;">فارغ</div>';
        } else {
            shelf.items.forEach((item, idx) => {
                itemsHtml += `
                <div class="item-row">
                    <span><b>${item.name}</b> (${item.price}ج)</span>
                    <div>
                        <button style="padding:2px 6px; font-size:10px; background:#0288d1;" onclick="moveItem(${shelf.id}, ${idx})">نقل</button>
                        <button style="padding:2px 6px; font-size:10px; background:#d32f2f;" onclick="delItem(${shelf.id}, ${idx})">حذف</button>
                    </div>
                </div>`;
            });
        }

        container.innerHTML += `
        <div class="shelf-card">
            <div class="shelf-title">
                <span>الرف (${shelf.id})</span>
                <span>${shelf.items.length} منتج</span>
            </div>
            <div style="max-height:120px; overflow-y:auto; margin-bottom:6px;">${itemsHtml}</div>
            <button style="background:#f57c00; font-size:12px; padding:6px;" onclick="openShelfCam(${shelf.id})">📷 مسح بالرف</button>
        </div>`;
    });
    updateStatus();
}

// تشغيل الكاميرا للرف
function openShelfCam(id){
    activeShelfId = id;
    mode = 'shelf';
    startCamera();
}

function startGlobalSearch(){
    mode = 'global';
    startCamera();
}

function startCamera(){
    let readerDiv = document.getElementById("reader");
    let closeBtn = document.getElementById("closeCam");
    readerDiv.style.display = "block";
    closeBtn.style.display = "block";

    if(html5QrCode){
        try{ html5QrCode.stop(); }catch(e){}
    }

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 120 } },
        (text) => {
            stopCamera();
            processCode(text);
        },
        (err) => {}
    ).catch(e => {
        alert("تعذر تشغيل الكاميرا، تأكد من إعطاء إذن الكاميرا للمتصفح.");
        stopCamera();
    });
}

function stopCamera(){
    if(html5QrCode){
        html5QrCode.stop().then(() => {
            document.getElementById("reader").style.display = "none";
            document.getElementById("closeCam").style.display = "none";
        }).catch(() => {
            document.getElementById("reader").style.display = "none";
            document.getElementById("closeCam").style.display = "none";
        });
    } else {
        document.getElementById("reader").style.display = "none";
        document.getElementById("closeCam").style.display = "none";
    }
}

// معالجة الباركود المقروء
function processCode(code){
    code = String(code).trim();

    if(mode === 'shelf'){
        // التحقق هل الباركود موجود في رف آخر؟
        let foundShelf = null;
        shelves.forEach(s => {
            if(s.items.some(i => i.barcode === code)) foundShelf = s.id;
        });

        if(foundShelf && foundShelf !== activeShelfId){
            let ok = confirm(`⚠️ هذا المنتج موجود مسبقاً في الرف (${foundShelf}). هل تريد نقله للرف الحالي (${activeShelfId})؟`);
            if(!ok) return;
            let oldS = shelves.find(s => s.id === foundShelf);
            oldS.items = oldS.items.filter(i => i.barcode !== code);
            saveShelf(foundShelf);
        }

        let shelf = shelves.find(s => s.id === activeShelfId);
        if(shelf.items.some(i => i.barcode === code)){
            alert("هذا المنتج مسجل بالفعل في هذا الرف!");
            return;
        }

        let info = getProductDetails(code);
        let name = info ? info.name : prompt("المنتج غير موجود بملف الأصناف، أدخل اسمه:", "صنف جديد");
        if(!name) return;
        let price = info ? info.price : prompt("أدخل السعر:", "0");

        shelf.items.push({ barcode: code, name: name, price: price });
        saveShelf(activeShelfId);
        renderShelves();
        alert(`✅ تمت الإضافة للرف ${activeShelfId}\nالاسم: ${name}\nالسعر: ${price} ج`);

    } else if(mode === 'global'){
        let foundShelf = null, foundItem = null;
        shelves.forEach(s => {
            let itm = s.items.find(i => i.barcode === code);
            if(itm){ foundShelf = s.id; foundItem = itm; }
        });

        let box = document.getElementById("searchResBox");
        box.style.display = "block";
        if(foundItem){
            box.innerHTML = `📍 موجود في: <b>الرف (${foundShelf})</b><br>🏷️ الاسم: <b>${foundItem.name}</b><br>💰 السعر: <span style="color:red;">${foundItem.price} ج</span><br>🔢 الباركود: ${code}`;
        } else {
            let info = getProductDetails(code);
            if(info){
                box.innerHTML = `❌ غير مسجل بأي رف.<br>🏷️ اسم الصنف (من ملف المحل): <b>${info.name}</b><br>💰 السعر: ${info.price} ج<br>🔢 الباركود: ${code}`;
            } else {
                box.innerHTML = `❌ الباركود (${code}) غير موجود نهائياً لا بالأرفف ولا بملف الأصناف.`;
            }
        }
    }
}

function delItem(shelfId, idx){
    if(confirm("حذف هذا المنتج من الرف؟")){
        let shelf = shelves.find(s => s.id === shelfId);
        shelf.items.splice(idx, 1);
        saveShelf(shelfId);
        renderShelves();
    }
}

function moveItem(shelfId, idx){
    let shelf = shelves.find(s => s.id === shelfId);
    let item = shelf.items[idx];
    let target = prompt("أدخل رقم الرف الجديد (1 إلى 150):");
    if(!target) return;
    let tId = parseInt(target);
    let tShelf = shelves.find(s => s.id === tId);
    if(!tShelf){ alert("رقم الرف خطأ!"); return; }

    if(tShelf.items.some(i => i.barcode === item.barcode)){
        alert("المنتج موجود مسبقاً في الرف المستهدف!");
        return;
    }

    shelf.items.splice(idx, 1);
    saveShelf(shelfId);
    tShelf.items.push(item);
    saveShelf(tId);
    renderShelves();
    alert("✅ تم النقل بنجاح.");
}

// البحث النصي
document.getElementById("textSearch").oninput = function(){
    let q = this.value.trim().toLowerCase();
    let box = document.getElementById("searchResBox");
    if(!q){ box.style.display = "none"; return; }

    box.style.display = "block";
    let matches = [];
    shelves.forEach(s => {
        s.items.forEach(i => {
            if(i.name.toLowerCase().includes(q) || i.barcode.includes(q) || String(s.id) === q){
                matches.push({ shelfId: s.id, ...i });
            }
        });
    });

    if(matches.length > 0){
        let html = "";
        matches.forEach(m => {
            html += `<div>📍 الرف (${m.shelfId}) | 🏷️ ${m.name} | <span style="color:red;">${m.price}ج</span> | ${m.barcode}</div><hr style="margin:4px 0;">`;
        });
        box.innerHTML = html;
    } else {
        box.innerHTML = "❌ لا توجد نتائج مطابقة.";
    }
};

// تصدير ملف إكسل بالـ 4 أعمدة المطلوبة
function exportShelvesExcel(){
    let data = [];
    shelves.forEach(s => {
        s.items.forEach(i => {
            data.push({
                "اسم الصنف": i.name,
                "رقم الرف": s.id,
                "باركود الصنف": i.barcode,
                "سعر البيع": i.price
            });
        });
    });

    if(data.length === 0){
        alert("لا توجد منتجات مسجلة في الأرفف لتصديرها!");
        return;
    }

    let ws = XLSX.utils.json_to_sheet(data);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Shelves_Report");
    XLSX.writeFile(wb, "Center_AlTawfeer_Shelves.xlsx");
}

function clearAllShelves(){
    if(confirm("⚠️ هل أنت متأكد من مسح جميع بيانات الأرفف نهائياً؟")){
        shelves.forEach(s => {
            localStorage.removeItem("shelf_data_" + s.id);
            s.items = [];
        });
        renderShelves();
        document.getElementById("searchResBox").style.display = "none";
        alert("تم تفريغ جميع الأرفف.");
    }
}

renderShelves();
</script>

</body>
</html>
