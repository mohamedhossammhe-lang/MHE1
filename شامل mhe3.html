<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنتر التوفير - نظام إدارة الأرفف الشامل</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}
body{
background:#eceff1;
padding:15px;
}
.card{
max-width:700px;
margin:auto;
background:#ffffff;
border-radius:20px;
padding:20px;
box-shadow:0 5px 25px rgba(0,0,0,.20);
}
.title{
text-align:center;
margin-top:5px;
font-size:30px;
color:#ff9800;
font-weight:bold;
}
.toolbar{
display:flex;
flex-direction:column;
gap:10px;
margin-top:15px;
}
input, button{
width:100%;
padding:14px;
font-size:16px;
border-radius:12px;
border:2px solid #ddd;
outline:none;
font-weight:bold;
cursor:pointer;
}
input:focus{
border-color:#009688;
}
button{
border:none;
color:white;
transition:.3s;
}
.btn-excel{ background:#ff9800; }
.btn-export{ background:#2e7d32; }
.btn-search{ background:#009688; }
.btn-clear{ background:#d32f2f; }

#reader {
margin-top: 15px;
border-radius: 12px;
overflow: hidden;
display: none;
}

.shelves-grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
margin-top:20px;
}
@media(min-width: 600px){
.shelves-grid{
grid-template-columns:repeat(2, 1fr);
}
}
.shelf-card{
background:#fafafa;
border-radius:12px;
padding:12px;
border:2px solid #ddd;
border-right:6px solid #1565c0;
}
.shelf-title{
font-size:15px;
font-weight:bold;
color:#333;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
}
.item-row{
background:#fff;
padding:8px;
margin-bottom:6px;
border-radius:8px;
border:1px solid #eee;
font-size:13px;
display:flex;
flex-direction:column;
gap:4px;
}
.item-details{
display:flex;
justify-content:space-between;
font-weight:bold;
color:#333;
}
.item-price{
color:red;
}
.item-actions{
display:flex;
gap:5px;
margin-top:4px;
}
.item-actions button{
padding:6px;
font-size:11px;
border-radius:6px;
}
.search-result-box{
margin-top:15px;
background:#e3f2fd;
border-radius:12px;
padding:15px;
border:2px dashed #90caf9;
display:none;
}
.note{
margin-top:15px;
font-size:13px;
color:#666;
text-align:center;
}
</style>
</head>
<body>

<div class="card">
<div class="title">🏪 سنتر التوفير</div>

<div class="toolbar">
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv" style="display:none">
<button class="btn-excel" id="fileBtn">📂 اختيار ملف أصناف المحل (Excel)</button>
<button class="btn-export" id="exportExcelBtn">📥 تحميل شيت الأرفف (Excel بالأربعة أعمدة)</button>
<button class="btn-search" id="searchScanBtn">📷 مسح باركود لمعرفة الرف أو إضافته</button>
<input type="text" id="searchBox" placeholder="🔍 ابحث باسم المنتج أو الباركود أو رقم الرف...">
<button class="btn-clear" id="clearBtn">🗑️ حذف جميع بيانات الأرفف</button>
</div>

<div class="search-result-box" id="searchResultBox">
<h3 style="color:#0d47a1; margin-bottom:8px; font-size:15px;">نتيجة البحث:</h3>
<div id="searchResultContent" style="font-size:14px; color:#333;"></div>
</div>

<div id="reader"></div>

<div class="shelves-grid" id="shelvesContainer"></div>

<div class="note" id="status">
جاري التحقق من البيانات...
</div>
</div>

<script>
let products = []; 
let shelves = [];  
let html5QrCode = null;
let activeShelfId = null;
let cameraMode = 'shelf';

let savedProducts = localStorage.getItem("saved_store_products_v4");
if(savedProducts){
    try { products = JSON.parse(savedProducts); } catch(e){}
}

for(let i = 1; i <= 150; i++){
    let saved = localStorage.getItem("shelf_item_v4_" + i);
    shelves.push({
        id: i,
        items: saved ? JSON.parse(saved) : []
    });
}

function saveShelfData(shelfId){
    let shelf = shelves.find(s => s.id === shelfId);
    localStorage.setItem("shelf_item_v4_" + shelfId, JSON.stringify(shelf.items));
}

function updateStatusMessage(){
    let totalItemsCount = 0;
    shelves.forEach(s => totalItemsCount += s.items.length);
    let msg = "✅ يعمل بدون إنترنت | ";
    if(products.length > 0){
        msg += "الأصناف محملة (" + products.length + ") | ";
    } else {
        msg += "⚠️ اختر ملف الأصناف أولاً | ";
    }
    msg += "المنتجات بالأرفف: " + totalItemsCount;
    document.getElementById("status").innerHTML = msg;
}

const excelFile = document.getElementById("excelFile");
document.getElementById("fileBtn").onclick = () => excelFile.click();

excelFile.onchange = function(e){
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = function(evt){
        try {
            let data = evt.target.result;
            let workbook = XLSX.read(data, {type: 'binary'});
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            products = XLSX.utils.sheet_to_json(sheet);
            localStorage.setItem("saved_store_products_v4", JSON.stringify(products));
            updateStatusMessage();
            alert("✅ تم تحميل وحفظ ملف أصناف المحل بنجاح دائم!");
        } catch(err) {
            alert("خطأ في قراءة ملف الإكسل.");
        }
    };
    reader.readAsBinaryString(file);
};

// تصدير الأرفف والإضافات بـ 4 أعمدة دقيقة
document.getElementById("exportExcelBtn").onclick = function(){
    let exportData = [];
    shelves.forEach(shelf => {
        shelf.items.forEach(item => {
            exportData.push({
                "اسم الصنف": item.name,
                "رقم الرف": shelf.id,
                "الباركود": item.barcode,
                "السعر": item.price
            });
        });
    });

    if(exportData.length === 0){
        alert("لا توجد منتجات مسجلة في الأرفف لتصديرها حالياً!");
        return;
    }

    let sheet = XLSX.utils.json_to_sheet(exportData);
    let book = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(book, sheet, "Shelves_Products");
    XLSX.writeFile(book, "Center_Shelves_Report.xlsx");
};

function findProductDetails(code) {
    let cleanCode = String(code).trim();
    for(let i = 0; i < products.length; i++){
        let row = products[i];
        let barValue = row["رقم الباركود"] || row["كود الصنف"] || row["الباركود"] || row["Barcode"] || "";
        let cellStr = String(barValue).trim();
        if(cellStr === cleanCode || cellStr.includes(cleanCode) || cellStr.split('|').map(b=>b.trim()).includes(cleanCode)) {
            return {
                name: row["اسم المنتج"] || row["اسم الصنف"] || row["الصنف"] || "اسم غير متوفر",
                price: row["سعر البيع"] || row["السعر"] || row["بيع"] || "0.00"
            };
        }
    }
    return null;
}

function renderShelves(){
    const container = document.getElementById("shelvesContainer");
    container.innerHTML = "";
    
    shelves.forEach(shelf => {
        let itemsHtml = "";
        if(shelf.items.length === 0){
            itemsHtml = '<div style="color:#999; font-size:12px; text-align:center; padding:4px;">فارغ</div>';
        } else {
            shelf.items.forEach((item, idx) => {
                itemsHtml += `
                <div class="item-row">
                    <div class="item-details">
                        <span>📦 ${item.name}</span>
                        <span class="item-price">${item.price} ج</span>
                    </div>
                    <div style="font-size:11px; color:#666;">باركود: ${item.barcode}</div>
                    <div class="item-actions">
                        <button style="background:#0288d1;" onclick="moveItem(${shelf.id}, ${idx})">🔄 نقل</button>
                        <button style="background:#d32f2f;" onclick="deleteItem(${shelf.id}, ${idx})">🗑️ حذف</button>
                    </div>
                </div>`;
            });
        }

        container.innerHTML += `
        <div class="shelf-card">
            <div class="shelf-title">
                <span>رف رقم (${shelf.id})</span>
                <span style="font-size:11px; background:#e3f2fd; color:#1565c0; padding:2px 6px; border-radius:4px;">${shelf.items.length} منتج</span>
            </div>
            <div style="max-height:150px; overflow-y:auto; margin-bottom:8px;">${itemsHtml}</div>
            <button style="background:#f57c00; font-size:13px; padding:8px;" onclick="startShelfCamera(${shelf.id})">📷 مسح باركود للرف</button>
        </div>
        `;
    });
    updateStatusMessage();
}

function startShelfCamera(shelfId){
    activeShelfId = shelfId;
    cameraMode = 'shelf';
    startCameraEngine("وجّه الكاميرا نحو باركود الرف " + shelfId);
}

document.getElementById("searchScanBtn").onclick = function(){
    cameraMode = 'globalSearch';
    startCameraEngine("وجّه الكاميرا للبحث عن الصنف");
};

function startCameraEngine(titleText){
    const readerDiv = document.getElementById("reader");
    readerDiv.style.display = "block";
    
    if(html5QrCode) {
        try { html5QrCode.stop(); } catch(e){}
    }

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
            handleScannedCode(decodedText);
            stopCamera();
        },
        (error) => {}
    ).catch(err => {
        alert("تعذر تشغيل الكاميرا، تأكد من إعطاء الصلاحيات لمتصفحك.");
        stopCamera();
    });
}

function stopCamera(){
    if(html5QrCode){
        html5QrCode.stop().then(() => {
            document.getElementById("reader").style.display = "none";
        }).catch(() => {
            document.getElementById("reader").style.display = "none";
        });
    } else {
        document.getElementById("reader").style.display = "none";
    }
}

function handleScannedCode(code){
    code = String(code).trim();

    if(cameraMode === 'shelf'){
        let existingShelfId = null;
        shelves.forEach(s => {
            if(s.items.some(i => i.barcode === code)) {
                existingShelfId = s.id;
            }
        });

        if(existingShelfId && existingShelfId !== activeShelfId){
            let confirmMove = confirm("⚠️ هذا المنتج مسجل مسبقاً في الرف (" + existingShelfId + "). هل تريد نقله للرف الحالي (" + activeShelfId + ")؟");
            if(!confirmMove) return;
            let oldShelf = shelves.find(s => s.id === existingShelfId);
            oldShelf.items = oldShelf.items.filter(i => i.barcode !== code);
            saveShelfData(existingShelfId);
        }

        let shelf = shelves.find(s => s.id === activeShelfId);
        if(shelf.items.some(i => i.barcode === code)){
            alert("هذا المنتج موجود بالفعل في هذا الرف!");
            return;
        }

        let details = findProductDetails(code);
        let name = details ? details.name : prompt("المنتج غير موجود بملف الأصناف. أدخل اسم المنتج:", "منتج جديد");
        if(!name) return;
        let price = details ? details.price : prompt("أدخل السعر:", "0.00");

        shelf.items.push({ barcode: code, name: name, price: price });
        saveShelfData(activeShelfId);
        renderShelves();
        alert("✅ تمت الإضافة بنجاح للرف " + activeShelfId);

    } else if(cameraMode === 'globalSearch'){
        let foundShelf = null;
        let foundItem = null;

        shelves.forEach(s => {
            let item = s.items.find(i => i.barcode === code);
            if(item){
                foundShelf = s.id;
                foundItem = item;
            }
        });

        let resultBox = document.getElementById("searchResultBox");
        let resultContent = document.getElementById("searchResultContent");
        resultBox.style.display = "block";

        if(foundItem){
            resultContent.innerHTML = `
                📍 مكان الصنف: <b>الرف رقم (${foundShelf})</b><br>
                🏷️ اسم الصنف: <b>${foundItem.name}</b><br>
                💰 السعر: <span style="color:red; font-weight:bold;">${foundItem.price} ج</span><br>
                🔢 الباركود: ${foundItem.barcode}
            `;
        } else {
            let details = findProductDetails(code);
            if(details){
                resultContent.innerHTML = `
                    ❌ غير مسجل في أي رف حتى الآن.<br>
                    🏷️ الاسم (من ملف المحل): <b>${details.name}</b><br>
                    💰 السعر: <span style="color:red;">${details.price} ج</span><br>
                    🔢 الباركود: ${code}
                `;
            } else {
                resultContent.innerHTML = `❌ الباركود (${code}) غير موجود نهائياً.`;
            }
        }
    }
}

function deleteItem(shelfId, itemIndex){
    if(confirm("هل تريد حذف هذا المنتج من الرف؟")){
        let shelf = shelves.find(s => s.id === shelfId);
        shelf.items.splice(itemIndex, 1);
        saveShelfData(shelfId);
        renderShelves();
    }
}

function moveItem(shelfId, itemIndex){
    let shelf = shelves.find(s => s.id === shelfId);
    let item = shelf.items[itemIndex];
    let targetShelfNum = prompt("أدخل رقم الرف الجديد (من 1 إلى 150):");
    if(!targetShelfNum) return;
    
    let targetId = parseInt(targetShelfNum);
    let targetShelf = shelves.find(s => s.id === targetId);
    
    if(!targetShelf){
        alert("رقم الرف غير صحيح!");
        return;
    }

    if(targetShelf.items.some(i => i.barcode === item.barcode)){
        alert("المنتج موجود مسبقاً في الرف المستهدف!");
        return;
    }

    shelf.items.splice(itemIndex, 1);
    saveShelfData(shelfId);

    targetShelf.items.push(item);
    saveShelfData(targetId);
    
    renderShelves();
    alert("✅ تم النقل بنجاح إلى الرف " + targetId);
}

const searchBox = document.getElementById("searchBox");
searchBox.oninput = function(){
    let query = this.value.trim().toLowerCase();
    let resultBox = document.getElementById("searchResultBox");
    let resultContent = document.getElementById("searchResultContent");

    if(query === ""){
        resultBox.style.display = "none";
        return;
    }

    resultBox.style.display = "block";
    let matches = [];

    shelves.forEach(s => {
        s.items.forEach(i => {
            if(i.name.toLowerCase().includes(query) || i.barcode.toLowerCase().includes(query) || String(s.id) === query){
                matches.push({ shelfId: s.id, ...i });
            }
        });
    });

    if(matches.length > 0){
        let html = "";
        matches.forEach(m => {
            html += `<div style="border-bottom:1px solid #ccc; padding:5px 0;">
                📍 <b>الرف ${m.shelfId}</b> | 🏷️ ${m.name} | 💰 <span style="color:red;">${m.price}ج</span> | 🔢 ${m.barcode}
            </div>`;
        });
        resultContent.innerHTML = html;
    } else {
        resultContent.innerHTML = "❌ لا توجد نتائج مطابقة.";
    }
};

document.getElementById("clearBtn").onclick = function(){
    if(confirm("⚠️ هل أنت متأكد من مسح جميع بيانات الأرفف؟")){
        shelves.forEach(s => {
            localStorage.removeItem("shelf_item_v4_" + s.id);
            s.items = [];
        });
        renderShelves();
        document.getElementById("searchResultBox").style.display = "none";
        alert("تم مسح بيانات الأرفف بنجاح.");
    }
};

renderShelves();
</script>

</body>
    </html>
