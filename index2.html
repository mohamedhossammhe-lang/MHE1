<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنتر التوفير - النظام الإداري الذكي</title>
    </head>
<body>

    <div id="app">
        <h1>سنتر التوفير - النظام الإداري الذكي</h1>
        </div>

    <script>
        // متغيرات النظام العامة (افترض أنها معرّفة لديك في الكود الأصلي)
        let shelves = {};
        let products = {};
        let currentUser = "admin"; // أو اسم المستخدم الحالي

        function updateStatus() {
            console.log("تم تحديث الحالة والاتصال بنجاح.");
        }

        // ==========================================
        // 1. دوال الحفظ السحابي بصيغة async مع معلومات التحديث
        // ==========================================

        async function saveToCloudShelves(){
            const { doc, setDoc } = window.firebaseModules;
            try{
                await setDoc(
                    doc(window.db, "store_data", "shelves_doc"),
                    {
                        shelves: shelves,
                        lastUpdate: Date.now(),
                        updatedBy: currentUser
                    }
                );
                updateStatus();
            }catch(err){
                alert("فشل رفع البيانات للسحابة");
                console.error(err);
            }
        }

        async function saveToCloudProducts(){
            const { doc, setDoc } = window.firebaseModules;
            try{
                await setDoc(
                    doc(window.db, "store_data", "products_doc"),
                    {
                        products: products,
                        lastUpdate: Date.now(),
                        updatedBy: currentUser
                    }
                );
                updateStatus();
            }catch(err){
                alert("فشل رفع المنتجات للسحابة");
                console.error(err);
            }
        }


        // ==========================================
        // 2. الحفظ التلقائي في الخلفية (كل 30 ثانية)
        // ==========================================

        setInterval(() => {
            if(currentUser){
                autoBackgroundSave();
            }
        }, 30000);

        async function autoBackgroundSave() {
            const { doc, setDoc } = window.firebaseModules;
            try {
                await Promise.all([
                    setDoc(doc(window.db, "store_data", "shelves_doc"), {
                        shelves: shelves,
                        lastUpdate: Date.now(),
                        updatedBy: currentUser
                    }),
                    setDoc(doc(window.db, "store_data", "products_doc"), {
                        products: products,
                        lastUpdate: Date.now(),
                        updatedBy: currentUser
                    })
                ]);
            } catch (err) {
                console.error("خطأ في الحفظ التلقائي الخلفي:", err);
            }
        }


        // ==========================================
        // 3. الحفظ الفوري بعد العمليات (إضافة، حذف، نقل، رفع ملف، إلخ)
        // ==========================================

        async function handleAddProduct() {
            // كود إضافة المنتج هنا...
            await saveToCloudProducts();
        }

        async function handleDeleteProduct() {
            // كود الحذف هنا...
            await saveToCloudProducts();
            await saveToCloudShelves();
        }

        async function handleMoveProduct() {
            // كود النقل هنا...
            await saveToCloudShelves();
        }

        async function handleExcelUpload() {
            // كود رفع ملف إكسل هنا...
            await saveToCloudProducts();
        }

        async function handlePasswordChange() {
            // كود تغيير كلمة المرور هنا...
            await saveToCloudShelves();
        }


        // ==========================================
        // 4. الحفظ اليدوي الشامل باستخدام Promise.all
        // ==========================================

        async function manualSaveAllData() {
            const { doc, setDoc } = window.firebaseModules;
            try {
                await Promise.all([
                    setDoc(doc(window.db, "store_data", "shelves_doc"), {
                        shelves: shelves,
                        lastUpdate: Date.now(),
                        updatedBy: currentUser
                    }),
                    setDoc(doc(window.db, "store_data", "products_doc"), {
                        products: products,
                        lastUpdate: Date.now(),
                        updatedBy: currentUser
                    })
                ]);
                
                alert("تم حفظ ورفع جميع البيانات للسحابة بنجاح");
                updateStatus();
            } catch (err) {
                alert("حدث خطأ أثناء رفع البيانات للسحابة");
                console.error(err);
            }
        }
    </script>
</body>
</html>
